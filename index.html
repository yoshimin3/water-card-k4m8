<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>本日の水分カード</title>
<style>
  :root{--bg:#FFF6E5;--ink:#5a3a26;--coral:#F26B4F;--water:#6FB7E9;--water2:#A9D8F5;--glass:#9CC7E0;--card:#fffdf8;--line:#E8D3B5}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;font-weight:700;-webkit-tap-highlight-color:transparent}
  .wrap{max-width:560px;margin:0 auto;padding:20px 16px 40px}
  .brand{text-align:center;font-size:15px;letter-spacing:.1em;color:#9a7a60}
  h1{text-align:center;font-size:34px;margin:6px 0 4px;letter-spacing:.04em}
  .date{text-align:center;font-size:20px;color:#8a6a50;margin-bottom:14px}
  .card{background:var(--card);border:3px solid var(--line);border-radius:28px;padding:20px 14px 18px;box-shadow:0 6px 18px rgba(120,80,40,.08)}
  .count{display:flex;justify-content:center;align-items:baseline;gap:8px;margin-bottom:6px}
  .count b{font-size:64px;color:var(--coral);line-height:1}
  .count span{font-size:26px}
  .bar{height:16px;background:#f3e6d0;border-radius:99px;overflow:hidden;margin:6px 6px 16px}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--water2),var(--water));border-radius:99px;transition:width .4s}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 6px}
  .cell{border:0;background:transparent;padding:4px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:inherit;color:inherit}
  .cell svg{width:100%;max-width:104px;height:auto;overflow:visible}
  .cell .n{font-size:20px;color:#9a7a60}
  .cell.on .n{color:var(--coral)}
  .cell .water{transform-origin:50% 100%;transform:scaleY(0);transition:transform .5s cubic-bezier(.3,1.4,.5,1)}
  .cell.on .water{transform:scaleY(1)}
  .cell.pop svg{animation:pop .45s}
  @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.18) rotate(-4deg)}100%{transform:scale(1)}}
    .msg i{font-style:normal;display:inline-block}
  .msg{margin:18px 4px 4px;text-align:center;font-size:24px;line-height:1.6;min-height:2.6em}
  .party{display:none;text-align:center;margin-top:6px}
  .party.show{display:block}
  .party svg{width:150px;height:auto;animation:wob 1.6s ease-in-out infinite}
  .party.big svg{width:230px}
  @keyframes wob{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
  .party p{margin:4px 0 0;font-size:26px;color:var(--coral)}
  .btns{display:flex;gap:12px;justify-content:center;margin-top:18px;flex-wrap:wrap}
  button.act{font-family:inherit;font-weight:700;font-size:20px;color:var(--ink);background:#fff;border:3px solid var(--line);border-radius:99px;padding:12px 24px;cursor:pointer}
  button.act:active{background:#f6ead6}
  .note{text-align:center;font-size:16px;color:#9a7a60;margin-top:16px;line-height:1.7}
  canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:9}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="wrap">
  <div class="brand">ビバランス部</div>
  <h1>本日の水分カード</h1>
  <div class="date" id="date"></div>
  <div class="card">
    <div class="count"><b id="cnt">0</b><span>/ 8 杯</span></div>
    <div class="bar"><i id="bar"></i></div>
    <div class="grid" id="grid"></div>

    <div class="party" id="p4">
      <svg viewBox="0 0 120 120" aria-hidden="true"><use href="#cracker"/></svg>
      <p>4杯 クリア！</p>
    </div>
    <div class="party big" id="p8">
      <svg viewBox="0 0 120 120" aria-hidden="true"><use href="#cracker"/></svg>
      <p>8杯 クリア！</p>
    </div>
    <div class="msg" id="msg"></div>

    <div class="btns">
      <button class="act" id="undo">ひとつ戻す</button>
      <button class="act" id="reset">ぜんぶ消す</button>
    </div>
  </div>
  <div class="note">水を1杯のんだら、グラスをタップ。<br>日がかわると、自動でぜんぶ空にもどります。<br>記録は、このスマホ（パソコン）の中だけに残ります。</div>
</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="cracker" viewBox="0 0 120 120">
      <g transform="rotate(32 60 76)">
        <path d="M54 114 L66 114 L80 52 L40 52 Z" fill="#F7A78F" stroke="#5a3a26" stroke-width="3" stroke-linejoin="round"/>
        <path d="M46 96 L74 96 M43 80 L77 80 M41 66 L79 66" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
        <ellipse cx="60" cy="52" rx="20" ry="5" fill="#FFE08A" stroke="#5a3a26" stroke-width="3"/>
      </g>
      <g stroke-linecap="round" fill="none" stroke-width="4">
        <path d="M70 34 C 80 22, 92 24, 98 14" stroke="#F26B4F"/>
        <path d="M76 44 C 90 40, 100 46, 110 38" stroke="#6FB7E9"/>
        <path d="M66 26 C 68 14, 60 8, 62 2" stroke="#F2C14E"/>
      </g>
      <circle cx="92" cy="30" r="4" fill="#F26B4F"/><circle cx="104" cy="24" r="3.5" fill="#6FB7E9"/>
      <circle cx="82" cy="14" r="3.5" fill="#F2C14E"/><circle cx="108" cy="50" r="3.5" fill="#F7A78F"/>
      <rect x="96" y="6" width="7" height="7" fill="#7BC9A0" transform="rotate(20 99 9)"/>
      <rect x="74" y="4" width="6" height="6" fill="#F26B4F" transform="rotate(-20 77 7)"/>
    </symbol>
    <symbol id="glass" viewBox="0 0 100 120">
      <clipPath id="gclip"><path d="M18 18 L82 18 L74 106 Q73 112 66 112 L34 112 Q27 112 26 106 Z"/></clipPath>
    </symbol>
  </defs>
</svg>

<script>
(function(){
  var KEY='bibalance_water_card_v1', TOTAL=8;
  var grid=document.getElementById('grid');
  function today(){var d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
  function jp(){var d=new Date();var w='日月火水木金土'[d.getDay()];return (d.getMonth()+1)+'月'+d.getDate()+'日（'+w+'）';}
  function load(){
    try{var s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&s.date===today()&&Array.isArray(s.on))return s;}catch(e){}
    return {date:today(),on:[]};
  }
  var state=load();
  function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}

  function glassSVG(i){
    return '<svg viewBox="0 0 100 120" aria-hidden="true">'+
      '<defs><clipPath id="c'+i+'"><path d="M18 18 L82 18 L74 106 Q73 112 66 112 L34 112 Q27 112 26 106 Z"/></clipPath></defs>'+
      '<g clip-path="url(#c'+i+')"><g class="water">'+
        '<rect x="10" y="30" width="80" height="90" fill="#6FB7E9"/>'+
        '<path d="M10 30 Q 25 22 40 30 T 70 30 T 100 30 L100 40 L10 40 Z" fill="#A9D8F5"/>'+
        '<circle cx="40" cy="70" r="4" fill="#fff" opacity=".6"/><circle cx="58" cy="88" r="3" fill="#fff" opacity=".6"/><circle cx="50" cy="52" r="2.5" fill="#fff" opacity=".6"/>'+
      '</g></g>'+
      '<path d="M18 18 L82 18 L74 106 Q73 112 66 112 L34 112 Q27 112 26 106 Z" fill="rgba(255,255,255,.35)" stroke="#8a6a50" stroke-width="4" stroke-linejoin="round"/>'+
      '<path d="M28 28 L33 98" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".8"/>'+
    '</svg>';
  }
  var cells=[];
  for(var i=0;i<TOTAL;i++){
    var b=document.createElement('button');
    b.className='cell';b.type='button';b.setAttribute('aria-label',(i+1)+'杯め');
    b.innerHTML=glassSVG(i)+'<span class="n">'+(i+1)+'杯</span>';
    (function(idx,btn){btn.addEventListener('click',function(){toggle(idx,btn);});})(i,b);
    grid.appendChild(b);cells.push(b);
  }
  function count(){return state.on.length;}
  function toggle(idx,btn){
    var p=state.on.indexOf(idx);
    if(p>=0){state.on.splice(p,1);}else{state.on.push(idx);btn.classList.add('pop');setTimeout(function(){btn.classList.remove('pop');},500);}
    var c=count();save();render(c===4||c===8);
    if(p<0&&(c===4||c===8))burst(c===8?160:60);
  }
  function msgFor(c){
    if(c===0)return '水を1杯のんだら、<br>グラスをタップしてね。';
    if(c<4)return 'いい調子です！<br>あと'+(4-c)+'杯で4杯クリア。';
    if(c===4)return 'この調子で、<br>あと4杯、のんでみよう。';
    if(c<8)return 'あと'+(8-c)+'杯で、全部クリア。';
    return '<i>今日は</i><i>全部飲めました！</i>';
  }
  function render(){
    document.getElementById('date').textContent=jp();
    var c=count();
    document.getElementById('cnt').textContent=c;
    document.getElementById('bar').style.width=(c/TOTAL*100)+'%';
    cells.forEach(function(b,i){b.classList.toggle('on',state.on.indexOf(i)>=0);});
    document.getElementById('msg').innerHTML=msgFor(c);
    document.getElementById('p4').classList.toggle('show',c>=4&&c<8);
    document.getElementById('p8').classList.toggle('show',c>=8);
  }
  document.getElementById('undo').addEventListener('click',function(){
    if(state.on.length){state.on.pop();save();render();}
  });
  document.getElementById('reset').addEventListener('click',function(){
    if(state.on.length&&confirm('今日の分を、ぜんぶ消しますか？')){state.on=[];save();render();}
  });

  // かんたんなクラッカーの紙ふぶき
  var cv=document.getElementById('fx'),ctx=cv.getContext('2d'),parts=[],raf=null;
  function size(){cv.width=innerWidth;cv.height=innerHeight;}
  addEventListener('resize',size);size();
  var cols=['#F26B4F','#6FB7E9','#F2C14E','#7BC9A0','#F7A78F','#fff'];
  function burst(n){
    for(var i=0;i<n;i++){
      var a=Math.random()*Math.PI*2,s=4+Math.random()*9;
      parts.push({x:innerWidth/2,y:innerHeight*0.4,vx:Math.cos(a)*s,vy:Math.sin(a)*s-5,r:4+Math.random()*5,c:cols[(Math.random()*cols.length)|0],life:90+Math.random()*50,rot:Math.random()*6});
    }
    if(!raf)raf=requestAnimationFrame(tick);
  }
  function tick(){
    ctx.clearRect(0,0,cv.width,cv.height);
    parts=parts.filter(function(p){return p.life>0;});
    parts.forEach(function(p){
      p.x+=p.vx;p.y+=p.vy;p.vy+=0.28;p.vx*=0.99;p.life--;p.rot+=0.2;
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.c;ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*0.6);ctx.restore();
    });
    raf=parts.length?requestAnimationFrame(tick):null;
    if(!raf)ctx.clearRect(0,0,cv.width,cv.height);
  }
  render();
})();
</script>
</body>
</html>
